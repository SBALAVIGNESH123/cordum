name: demo-quickstart-e2e

# Blocking end-to-end guard for the demo-quickstart onboarding path.
# The rest of CI exercises the gateway, safety kernel, and scheduler
# in isolation — this workflow is the only job that actually runs
# `cordumctl pack install` and `cordumctl demo run quickstart`
# against the real compose stack, so nothing else catches a break
# in the install pipeline's topic-namespace validator or in the
# greeter worker's dispatch path. If this workflow goes red, the
# public "10-minute self-hosted install" promise is broken on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: demo-quickstart-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-quickstart-e2e:
    name: demo-quickstart-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Drop local replace directives (CI uses published modules)
        run: |
          go mod edit -dropreplace github.com/cordum/cordum/sdk || true
          go mod tidy

      - name: Build cordumctl
        run: |
          mkdir -p ./bin
          go build -o ./bin/cordumctl ./cmd/cordumctl

      - name: Bring up the compose stack (demo profile)
        run: |
          docker compose --profile demo up -d
          docker compose ps

      - name: Wait for gateway /api/v1/status to return 200
        # Condition-based poll so a warm image cache doesn't burn
        # 60s of wall time. Bails out as soon as curl returns 0.
        run: |
          attempts=0
          max_attempts=30
          until curl -ksf https://127.0.0.1:8081/api/v1/status >/dev/null; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "gateway /api/v1/status did not return 200 within $((max_attempts * 2))s"
              exit 1
            fi
            sleep 2
          done
          echo "gateway healthy after $((attempts * 2))s"

      - name: Install demo-quickstart pack
        # Exits 0 on successful install. Any non-zero here means the
        # pack manifest failed one of the gateway-side validators
        # (topic-namespace, schema-ref, protocol-version, etc.) — the
        # HTTP body carries the diagnostic.
        run: |
          ./bin/cordumctl pack install ./demo/quickstart/pack

      - name: Run quickstart demo and capture JSON
        run: |
          ./bin/cordumctl demo run quickstart --timeout 30 --output json > /tmp/demo.json
          cat /tmp/demo.json

      - name: Assert all three verdicts are present
        # Task rail: must not ship a fix that only works on the ALLOW path.
        # Each verdict is checked independently so a partial stack can't
        # pass by coincidence (e.g. greeter up but safety kernel missing
        # the DENY fragment).
        run: |
          jq -e '
            any(.rows[]; .verdict=="ALLOW")
            and any(.rows[]; .verdict=="DENY")
            and any(.rows[]; .verdict=="REQUIRE_APPROVAL")
          ' /tmp/demo.json

      - name: Capture gateway + worker logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/demo-logs
          docker compose logs --no-color > /tmp/demo-logs/compose.log || true
          docker compose ps > /tmp/demo-logs/compose-ps.txt || true
          cp /tmp/demo.json /tmp/demo-logs/demo.json 2>/dev/null || true

      - name: Upload demo output + logs as workflow artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-quickstart-e2e-failure
          path: /tmp/demo-logs/
          retention-days: 7

      - name: Tear down compose stack
        if: always()
        run: |
          docker compose --profile demo down -v
